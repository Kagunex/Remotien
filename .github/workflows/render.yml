name: Render Bagaimana Internet Bekerja (3D Remotion + ElevenLabs)

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: 'ElevenLabs Voice ID'
        required: false
        default: '21m00Tcm4TlvDq8ikWAM'
        type: string
      crf:
        description: 'Kualitas H.264 CRF (18 = tinggi, 23 = standar)'
        required: false
        default: '18'
        type: string

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Linux dependencies
      - name: Install Linux Chromium & WebGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libgl1 \
            libgl1-mesa-dri \
            xvfb

      # 4. Install project dependencies
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 5. Verify Remotion installation
      - name: Verify Node.js and Remotion dependencies
        run: |
          echo "Checking Node.js..."
          node --version

          echo "Checking npm..."
          npm --version

          echo "Checking Remotion packages..."
          npm ls remotion @remotion/cli --depth=0

      # 6. TypeScript check
      - name: Typecheck TypeScript
        run: npm run typecheck

      # 7. Validate ElevenLabs configuration
      - name: Validate ElevenLabs API configuration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY belum diatur di GitHub Secrets."
            exit 1
          fi

      # 8. Generate Indonesian voiceover
      - name: Generate Indonesian Voiceover via ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id || secrets.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: |
          node scripts/generate-elevenlabs-vo.mjs

      # 9. Verify voiceover files
      - name: Verify generated voiceovers
        run: |
          if ! compgen -G "public/audio/voiceover/*.wav" > /dev/null; then
            echo "::error::Tidak ditemukan file voiceover WAV."
            exit 1
          fi

          echo "Generated voiceover files:"
          ls -lh public/audio/voiceover/

      # 10. Render video
      - name: Render 90s 3D Motion Graphic Video
        env:
          CRF: ${{ inputs.crf || '18' }}
        run: |
          mkdir -p out

          npx remotion render \
            src/index.ts \
            InternetExplained \
            out/bagaimana-internet-bekerja.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --crf="$CRF" \
            --gl=angle

      # 11. Verify output
      - name: Verify rendered video
        run: |
          if [ ! -s out/bagaimana-internet-bekerja.mp4 ]; then
            echo "::error::File video tidak ditemukan atau kosong."
            exit 1
          fi

          echo "Video successfully rendered:"
          ls -lh out/bagaimana-internet-bekerja.mp4

      # 12. Upload artifact
      - name: Upload Rendered MP4 & Voiceovers
        uses: actions/upload-artifact@v4
        with:
          name: bagaimana-internet-bekerja-1080p
          path: |
            out/bagaimana-internet-bekerja.mp4
            public/audio/voiceover/*.wav
          if-no-files-found: error
          retention-days: 30
          
