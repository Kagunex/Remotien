name: Render THE LAST SIGNAL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-the-last-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render Part 01 (1080p / 60 FPS)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render Part01
        run: npm run render -- --concurrency=2

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: THE-LAST-SIGNAL-PART-01-1080p60
          path: out/part01.mp4
          if-no-files-found: error
          retention-days: 7
          
