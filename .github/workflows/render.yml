name: Render Internet Motion 9x16

on:
  workflow_dispatch:
    inputs:
      run_preflight:
        description: "Validasi project dan tes WebGL 1 frame"
        required: true
        type: boolean
        default: false

      confirm_full_render:
        description: "Izinkan full render setelah preflight berhasil"
        required: true
        type: boolean
        default: false

      generate_voiceover:
        description: "Generate ulang 8 voiceover (menggunakan kredit ElevenLabs)"
        required: true
        type: boolean
        default: false

      voice_id:
        description: "ElevenLabs Voice ID"
        required: false
        type: string
        default: "21m00Tcm4TlvDq8ikWAM"

      crf:
        description: "Kualitas H.264 CRF (18 tinggi, 23 standar)"
        required: true
        type: string
        default: "18"

permissions:
  contents: read

concurrency:
  group: internet-motion-render
  cancel-in-progress: false

jobs:
  render:
    if: ${{ inputs.run_preflight == true || inputs.confirm_full_render == true || inputs.generate_voiceover == true }}

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install system dependencies
      - name: Install system dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libgl1 \
            libgl1-mesa-dri \
            xvfb

      # 4. Verify environment
      - name: Verify environment
        run: |
          set -euo pipefail

          node --version
          npm --version
          ffmpeg -version
          ffprobe -version

      # 5. Install project dependencies
      - name: Install project dependencies
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "Installing from package-lock.json"
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json tidak ditemukan."
            echo "Installing dependencies without generating a lockfile."
            npm install --no-audit --no-fund --package-lock=false
          fi

      # 6. Validate project structure
      - name: Validate project structure
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "src/index.ts"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Required file not found: $FILE"
              exit 1
            fi

            echo "PASS: $FILE"
          done

          if [ ! -d "public" ]; then
            echo "::error::Public directory not found."
            exit 1
          fi

          echo "PASS: public directory"
          echo "Project structure validation successful."

      # 7. Verify Remotion
      - name: Verify Remotion dependencies
        run: |
          set -euo pipefail

          echo "Checking installed Remotion packages..."

          npm ls remotion @remotion/cli --depth=0

          echo "Checking Remotion CLI versions..."

          npx --no-install remotion versions

          echo "Remotion verification successful."

      # 8. TypeScript check
      - name: TypeScript check
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            echo "Running project typecheck script..."
            npm run typecheck

          elif [ -x "node_modules/.bin/tsc" ] && [ -f "tsconfig.json" ]; then
            echo "Running TypeScript compiler..."
            ./node_modules/.bin/tsc --noEmit

          else
            echo "::warning::No usable TypeScript check configured. Skipping."
          fi

      # 9. Validate ElevenLabs API key
      - name: Validate ElevenLabs configuration
        if: ${{ inputs.generate_voiceover == true }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY belum diatur di GitHub Secrets."
            exit 1
          fi

          echo "ElevenLabs API key detected."

      # 10. Verify voiceover generator
      - name: Verify voiceover generator
        if: ${{ inputs.generate_voiceover == true }}
        run: |
          set -euo pipefail

          if [ ! -f "scripts/generate-elevenlabs-vo.mjs" ]; then
            echo "::error::Voiceover generator tidak ditemukan."
            exit 1
          fi

          echo "Voiceover generator found."

      # 11. Generate ElevenLabs voiceovers
      - name: Generate Indonesian Voiceover
        if: ${{ inputs.generate_voiceover == true }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id || secrets.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: |
          set -euo pipefail

          node scripts/generate-elevenlabs-vo.mjs

      # 12. Verify voiceover files
      - name: Verify voiceover files
        if: ${{ inputs.generate_voiceover == true || inputs.confirm_full_render == true }}
        run: |
          set -euo pipefail

          DIRECTORY="public/audio/voiceover"

          if [ ! -d "$DIRECTORY" ]; then
            echo "::error::Voiceover directory not found: $DIRECTORY"
            exit 1
          fi

          for NUMBER in 01 02 03 04 05 06 07 08; do
            FILE="$DIRECTORY/scene-$NUMBER.wav"

            if [ ! -s "$FILE" ]; then
              echo "::error::Missing or empty voiceover: $FILE"
              exit 1
            fi

            echo "PASS: $FILE"
          done

          ACTUAL=$(find "$DIRECTORY" -maxdepth 1 -type f -name 'scene-*.wav' | wc -l)

          if [ "$ACTUAL" -ne 8 ]; then
            echo "::error::Expected exactly 8 scene WAV files, found $ACTUAL."
            exit 1
          fi

          echo "All 8 voiceovers verified."
          ls -lh "$DIRECTORY"

      # 13. Validate CRF
      - name: Validate CRF
        if: ${{ inputs.confirm_full_render == true }}
        env:
          CRF: ${{ inputs.crf }}
        run: |
          set -euo pipefail

          if ! [[ "$CRF" =~ ^[0-9]+$ ]] || [ "$CRF" -gt 51 ]; then
            echo "::error::CRF must be an integer between 0 and 51."
            exit 1
          fi

          echo "CRF validated: $CRF"

      # 14. WebGL preflight
      - name: WebGL preflight - 1 frame only
        if: ${{ inputs.run_preflight == true || inputs.confirm_full_render == true }}
        run: |
          set -euo pipefail

          mkdir -p out

          npx --no-install remotion still \
            src/index.ts \
            InternetExplained \
            out/preflight-frame.jpeg \
            --frame=0 \
            --gl=swangle \
            --concurrency=1

          if [ ! -s "out/preflight-frame.jpeg" ]; then
            echo "::error::Preflight image was not generated."
            exit 1
          fi

          echo "WebGL preflight successful."

      # 15. Full render
      - name: Render full video
        if: ${{ inputs.confirm_full_render == true }}
        env:
          CRF: ${{ inputs.crf }}
        run: |
          set -euo pipefail

          mkdir -p out

          npx --no-install remotion render \
            src/index.ts \
            InternetExplained \
            out/bagaimana-internet-bekerja-9x16.mp4 \
            --gl=swangle \
            --concurrency=2 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --crf="$CRF"

          if [ ! -s "out/bagaimana-internet-bekerja-9x16.mp4" ]; then
            echo "::error::Render output is missing or empty."
            exit 1
          fi

      # 16. Verify video metadata
      - name: Verify video metadata
        if: ${{ inputs.confirm_full_render == true }}
        run: |
          set -euo pipefail

          OUTPUT="out/bagaimana-internet-bekerja-9x16.mp4"

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -show_entries format=duration \
            -of json \
            "$OUTPUT" > out/render-metadata.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const metadata = JSON.parse(
            fs.readFileSync('out/render-metadata.json', 'utf8')
          );

          const video = metadata.streams?.[0];
          const duration = Number(metadata.format?.duration);

          const checks = [
            [video?.codec_name === 'h264', 'H.264 codec'],
            [video?.width === 1080, 'Width 1080'],
            [video?.height === 1920, 'Height 1920'],
            [video?.pix_fmt === 'yuv420p', 'Pixel format yuv420p'],
            [
              Number.isFinite(duration) &&
              duration >= 89.5 &&
              duration <= 90.5,
              'Duration approximately 90 seconds'
            ]
          ];

          let failed = false;

          for (const [passed, label] of checks) {
            console.log(`${passed ? 'PASS' : 'FAIL'}: ${label}`);

            if (!passed) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log('Video metadata verification successful.');
          NODE

          ls -lh "$OUTPUT"

      # 17. Upload rendered video
      - name: Upload rendered video and voiceovers
        if: ${{ inputs.confirm_full_render == true }}
        uses: actions/upload-artifact@v4
        with:
          name: bagaimana-internet-bekerja-9x16
          path: |
            out/bagaimana-internet-bekerja-9x16.mp4
            public/audio/voiceover/*.wav
          if-no-files-found: error
          retention-days: 7

      # 18. Upload preflight image
      - name: Upload preflight image
        if: ${{ inputs.run_preflight == true && inputs.confirm_full_render != true }}
        uses: actions/upload-artifact@v4
        with:
          name: internet-motion-preflight
          path: out/preflight-frame.jpeg
          if-no-files-found: error
          retention-days: 3

      # 19. Upload voiceovers only
      - name: Upload generated voiceovers
        if: ${{ inputs.generate_voiceover == true && inputs.confirm_full_render != true }}
        uses: actions/upload-artifact@v4
        with:
          name: internet-motion-voiceovers
          path: public/audio/voiceover/*.wav
          if-no-files-found: error
          retention-days: 7
          
