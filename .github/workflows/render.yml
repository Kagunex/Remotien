name: Render Bioluminescence Episode 01

on:
  workflow_dispatch:
    inputs:
      tts_provider:
        description: "TTS Provider"
        required: false
        default: "edge-tts"
        type: choice
        options:
          - edge-tts
          - elevenlabs
          - openai

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Chromium dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libgl1 \
            libegl1 \
            libgles2 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

          python -m pip install --upgrade pip
          python -m pip install edge-tts

      - name: Install Node dependencies
        run: npm install

      - name: Verify environment
        run: |
          node --version
          npm --version
          python --version
          ffmpeg -version

      - name: Generate SFX and Indonesian TTS narration
        env:
          TTS_PROVIDER: ${{ inputs.tts_provider || 'edge-tts' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run prepare:audio

      - name: Validate project assets, scenes, and timing
        run: npm run validate

      - name: Render MP4 video with Remotion
        run: |
          mkdir -p output

          npx remotion render \
            src/index.ts \
            BioluminescenceEpisode01 \
            output/bioluminescence-episode01.mp4 \
            --codec=h264 \
            --audio-codec=aac \
            --audio-bitrate=320k \
            --pixel-format=yuv420p \
            --crf=16 \
            --gl=swshader \
            --concurrency=2

      - name: Verify rendered MP4
        run: |
          test -s output/bioluminescence-episode01.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of json \
            output/bioluminescence-episode01.mp4

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bioluminescence-episode01-mp4
          path: output/bioluminescence-episode01.mp4
          if-no-files-found: error
          retention-days: 7
          
