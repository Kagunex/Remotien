name: Render Internet Motion 9x16

on:
  workflow_dispatch:
    inputs:
      run_preflight:
        description: "Validasi project dan tes WebGL 1 frame"
        required: true
        type: boolean
        default: false

      confirm_full_render:
        description: "Izinkan full render setelah preflight berhasil"
        required: true
        type: boolean
        default: false

      generate_voiceover:
        description: "Generate ulang 8 voiceover (menggunakan kredit ElevenLabs)"
        required: true
        type: boolean
        default: false

      voice_id:
        description: "ElevenLabs Voice ID"
        required: false
        type: string
        default: "21m00Tcm4TlvDq8ikWAM"

      crf:
        description: "Kualitas H.264 CRF (18 tinggi, 23 standar)"
        required: true
        type: string
        default: "18"

permissions:
  contents: read

concurrency:
  group: internet-motion-render
  cancel-in-progress: false

jobs:
  render:
    if: ${{ inputs.run_preflight == true || inputs.confirm_full_render == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libgl1 \
            libgl1-mesa-dri \
            xvfb

      - name: Verify environment
        run: |
          node --version
          npm --version
          ffmpeg -version
          ffprobe -version

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Verify Remotion dependencies
        run: npm ls remotion @remotion/cli --depth=0

      - name: Validate assets
        run: npm run validate:assets

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate ElevenLabs configuration
        if: ${{ inputs.generate_voiceover == true }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY belum diatur di GitHub Secrets."
            exit 1
          fi

      - name: Generate Indonesian Voiceover via ElevenLabs
        if: ${{ inputs.generate_voiceover == true }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id || secrets.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: |
          node scripts/generate-elevenlabs-vo.mjs

      - name: Verify voiceover files
        if: ${{ inputs.generate_voiceover == true || inputs.confirm_full_render == true }}
        run: |
          set -e

          EXPECTED=8
          DIRECTORY="public/audio/voiceover"

          if [ ! -d "$DIRECTORY" ]; then
            echo "::error::Folder voiceover tidak ditemukan: $DIRECTORY"
            exit 1
          fi

          ACTUAL=$(find "$DIRECTORY" -maxdepth 1 -type f -name 'scene-*.wav' | wc -l)

          echo "Expected voiceovers: $EXPECTED"
          echo "Found voiceovers: $ACTUAL"

          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::Voiceover harus berjumlah tepat 8 file WAV."
            exit 1
          fi

          for i in $(seq -w 1 8); do
            FILE="$DIRECTORY/scene-$i.wav"

            if [ ! -s "$FILE" ]; then
              echo "::error::Voiceover kosong atau tidak ditemukan: $FILE"
              exit 1
            fi
          done

          ls -lh "$DIRECTORY"

      - name: Validate CRF
        if: ${{ inputs.confirm_full_render == true }}
        env:
          CRF: ${{ inputs.crf }}
        run: |
          if ! [[ "$CRF" =~ ^[0-9]+$ ]] || [ "$CRF" -lt 0 ] || [ "$CRF" -gt 51 ]; then
            echo "::error::CRF harus berupa angka antara 0 sampai 51."
            exit 1
          fi

      - name: WebGL preflight - 1 frame only
        if: ${{ inputs.run_preflight == true || inputs.confirm_full_render == true }}
        run: |
          set -e
          mkdir -p out

          npx remotion still \
            src/index.ts \
            InternetExplained \
            out/preflight-frame.jpeg \
            --frame=0 \
            --gl=swangle \
            --concurrency=1

          test -s out/preflight-frame.jpeg
          echo "Preflight WebGL berhasil."

      - name: Render full video
        if: ${{ inputs.confirm_full_render == true }}
        env:
          CRF: ${{ inputs.crf }}
        run: |
          set -e
          mkdir -p out

          npx remotion render \
            src/index.ts \
            InternetExplained \
            out/bagaimana-internet-bekerja-9x16.mp4 \
            --gl=swangle \
            --concurrency=2 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --crf="$CRF"

      - name: Verify video metadata
        if: ${{ inputs.confirm_full_render == true }}
        run: |
          set -e

          OUTPUT="out/bagaimana-internet-bekerja-9x16.mp4"

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::File video tidak ditemukan atau kosong."
            exit 1
          fi

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -show_entries format=duration \
            -of json \
            "$OUTPUT" > out/render-metadata.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const metadata = JSON.parse(
            fs.readFileSync('out/render-metadata.json', 'utf8')
          );

          const video = metadata.streams?.[0];
          const duration = Number(metadata.format?.duration);

          const checks = [
            [video?.codec_name === 'h264', 'H.264 codec'],
            [video?.width === 1080, 'Width 1080'],
            [video?.height === 1920, 'Height 1920'],
            [video?.pix_fmt === 'yuv420p', 'Pixel format yuv420p'],
            [
              Number.isFinite(duration) &&
              duration >= 89.5 &&
              duration <= 90.5,
              'Duration approximately 90 seconds'
            ],
          ];

          let failed = false;

          for (const [passed, label] of checks) {
            console.log(`${passed ? 'PASS' : 'FAIL'}: ${label}`);
            if (!passed) failed = true;
          }

          if (failed) process.exit(1);
          NODE

          echo "Video berhasil diverifikasi."
          ls -lh "$OUTPUT"

      - name: Upload rendered video and voiceovers
        if: ${{ inputs.confirm_full_render == true }}
        uses: actions/upload-artifact@v4
        with:
          name: bagaimana-internet-bekerja-9x16
          path: |
            out/bagaimana-internet-bekerja-9x16.mp4
            public/audio/voiceover/*.wav
          if-no-files-found: error
          retention-days: 7

      - name: Upload preflight image
        if: ${{ inputs.run_preflight == true && inputs.confirm_full_render != true }}
        uses: actions/upload-artifact@v4
        with:
          name: internet-motion-preflight
          path: out/preflight-frame.jpeg
          if-no-files-found: error
          retention-days: 3
          
