name: Render Bagaimana Internet Bekerja (3D Remotion + ElevenLabs)

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: 'ElevenLabs Voice ID (opsional, default dari secret/script)'
        required: false
        default: '21m00Tcm4TlvDq8ikWAM'
      crf:
        description: 'Kualitas H.264 CRF (18 = tinggi, 23 = standar)'
        required: false
        default: '18'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux Chromium & WebGL dependencies for Remotion Three.js
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpangocairo-1.0-0 libpango-1.0-0 \
            libgl1-mesa-dri libgl1-mesa-glx xvfb

      - name: Install project dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Generate Indonesian Voiceover via ElevenLabs API
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ github.event.inputs.voice_id || secrets.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL_ID: 'eleven_multilingual_v2'
        run: node scripts/generate-elevenlabs-vo.mjs

      - name: Render 90s 3D Motion Graphic Video (1920x1080 @ 30fps)
        run: |
          mkdir -p out
          npx remotion render src/index.ts InternetExplained out/bagaimana-internet-bekerja.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --crf=${{ github.event.inputs.crf || '18' }} \
            --gl=angle

      - name: Upload Rendered MP4 & Generated Voiceovers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagaimana-internet-bekerja-1080p
          path: |
            out/bagaimana-internet-bekerja.mp4
            public/audio/voiceover/*.wav
          retention-days: 30
          
