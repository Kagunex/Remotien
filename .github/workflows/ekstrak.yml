name: Extract ZIP to Root

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama file ZIP di repository"
        required: true
        default: "metode-pemisahan-campuran-remotion.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP to Repository Root
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan: $ZIP_FILE"
            exit 1
          fi

          python3 - <<'PY'
          import zipfile
          import os
          from pathlib import Path

          archive = Path(os.environ["ZIP_FILE"])
          root = Path.cwd().resolve()

          with zipfile.ZipFile(archive) as z:
              files = [
                  name for name in z.namelist()
                  if not name.endswith("/")
              ]

              # Deteksi folder pembungkus ZIP
              first_parts = {
                  Path(name).parts[0]
                  for name in files
                  if Path(name).parts
              }

              strip_folder = (
                  len(first_parts) == 1
                  and all(len(Path(name).parts) > 1 for name in files)
              )

              for name in files:
                  parts = Path(name).parts

                  if strip_folder:
                      parts = parts[1:]

                  if not parts:
                      continue

                  # Jangan ekstrak folder .github
                  if parts[0] == ".github":
                      print("SKIP:", name)
                      continue

                  destination = (
                      root / Path(*parts)
                  ).resolve()

                  # Mencegah path traversal
                  if root not in destination.parents:
                      raise ValueError(
                          f"Path tidak aman: {name}"
                      )

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with z.open(name) as source:
                      destination.write_bytes(source.read())

                  print(
                      "EXTRACTED:",
                      destination.relative_to(root)
                  )

          print("Ekstraksi selesai!")
          PY

      - name: Delete ZIP Archive
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          rm -f -- "$ZIP_FILE"

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP contents to repository root"

      - name: Push Changes
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          
